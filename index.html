<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>关于冯世娇的灵魂拷问</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap');

        body {
            font-family: 'ZCOOL KuaiLe', cursive;
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
            overflow: hidden; /* Prevent scrolling */
            touch-action: manipulation;
        }

        .btn-animate {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Bouncy effect */
        }

        /* Fireworks Canvas */
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Floating background elements */
        .floater {
            position: absolute;
            opacity: 0.15;
            animation: float 15s infinite linear;
            z-index: 0;
            font-size: 2rem;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        /* Modal bounce animation */
        .modal-content {
            animation: bounceIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .piggy-wiggle {
            animation: wiggle 1s infinite;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }
        
        /* Ensure title is readable even if overlapped */
        .title-container {
            text-shadow: 2px 2px 0px #fff;
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative">

    <!-- Hint Button (Top Right) -->
    <button id="btn-hint" class="absolute top-6 right-6 z-[60] bg-white/80 hover:bg-white text-pink-500 hover:text-pink-600 font-bold py-2 px-4 rounded-full shadow-lg border-2 border-pink-200 transition-all transform hover:scale-105 flex items-center gap-2">
        <span>💡</span> 提示
    </button>

    <!-- Background Floaters -->
    <div id="background-elements"></div>

    <!-- Canvas for Fireworks -->
    <canvas id="canvas"></canvas>

    <!-- Main Content -->
    <!-- Added max-h-screen to prevent overflow issues on small screens -->
    <div id="main-card" class="z-10 bg-white/80 backdrop-blur-md p-6 md:p-8 rounded-3xl shadow-2xl text-center max-w-lg w-[90%] border-4 border-pink-200 transition-all duration-300 flex flex-col justify-center min-h-[50vh]">
        
        <!-- Header: High Z-Index to stay on top of buttons -->
        <!-- Added bg-white/50 to improve readability if buttons slide under -->
        <div class="relative z-[60] mb-4 md:mb-8 title-container bg-white/30 backdrop-blur-sm rounded-xl p-2">
            <h1 class="text-3xl md:text-5xl text-pink-600 font-bold leading-relaxed">
                请诚实回答：<br>
                <span class="text-4xl md:text-6xl text-pink-500">冯世娇</span> 是小猪吗？
            </h1>
        </div>

        <div class="flex flex-col gap-4 w-full items-center justify-center relative flex-grow">
            
            <!-- Yes Buttons Area -->
            <div class="flex flex-col md:flex-row gap-4 w-full justify-center items-center z-20 relative">
                <!-- Added max-w-full to prevent horizontal overflow initially -->
                <button id="btn-pig" class="btn-animate bg-pink-500 hover:bg-pink-600 text-white text-xl md:text-2xl px-8 py-4 rounded-full shadow-lg border-b-4 border-pink-700 w-full md:w-auto transform origin-center whitespace-nowrap max-w-full">
                    🐷 是小猪
                </button>
                
                <button id="btn-grandchild" class="btn-animate bg-purple-500 hover:bg-purple-600 text-white text-xl md:text-2xl px-8 py-4 rounded-full shadow-lg border-b-4 border-purple-700 w-full md:w-auto transform origin-center whitespace-nowrap max-w-full">
                    👴 是王朱德的小猪孙子
                </button>
            </div>

            <!-- The "No" Button (The Trap) -->
            <div class="mt-4 md:mt-8 relative h-16 w-full flex justify-center z-30">
                <button id="btn-no" class="btn-animate bg-gray-400 hover:bg-gray-500 text-white text-lg px-6 py-2 rounded-full shadow-md transform border-b-4 border-gray-600 absolute transition-all duration-300">
                    都不是
                </button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div id="result-modal" class="fixed inset-0 bg-black/60 z-[70] hidden flex items-center justify-center backdrop-blur-sm">
        <div class="modal-content bg-white p-8 rounded-3xl text-center max-w-sm mx-4 shadow-2xl border-4 border-yellow-300 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full bg-yellow-50 opacity-50 z-0"></div>
            
            <div class="relative z-10">
                <div id="modal-icon" class="text-8xl mb-4 piggy-wiggle">🐷</div>
                <h2 id="modal-title" class="text-3xl font-bold text-pink-600 mb-2"></h2>
                <p id="modal-text" class="text-xl text-gray-700 font-medium"></p>
                
                <button onclick="resetGame()" class="mt-8 bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-bold shadow-lg transform hover:scale-105 active:scale-95">
                    再玩一次
                </button>
            </div>
        </div>
    </div>

    <!-- Hint Modal -->
    <div id="hint-modal" class="fixed inset-0 bg-black/80 z-[80] hidden flex items-center justify-center backdrop-blur-sm opacity-0 transition-opacity duration-300">
        <div class="bg-white p-6 rounded-2xl max-w-md w-[90%] text-center relative border-4 border-pink-300 shadow-2xl transform scale-95 transition-transform duration-300" id="hint-content">
            <button onclick="closeHint()" class="absolute top-2 right-4 text-3xl text-gray-400 hover:text-gray-600">&times;</button>
            
            <h3 class="text-2xl text-pink-600 font-bold mb-4">✨ 请仔细辨别物种 ✨</h3>
            
            <div class="relative w-full aspect-square bg-gray-100 rounded-lg overflow-hidden border-2 border-pink-100 mb-4">
                <img id="hint-img" src="./4e8275a502b1984e5d48b35ae24f620d.jpg" 
                     onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1541364983171-a8ba01e95cfc?q=80&w=600&auto=format&fit=crop';"
                     alt="请仔细辨别" class="w-full h-full object-cover">
            </div>
            
            <p class="text-gray-500 text-sm">（点击任意处或关闭按钮退出）</p>
        </div>
    </div>

    <script>
        // --- Elements ---
        const btnNo = document.getElementById('btn-no');
        const btnPig = document.getElementById('btn-pig');
        const btnGrand = document.getElementById('btn-grandchild');
        const mainCard = document.getElementById('main-card');
        const resultModal = document.getElementById('result-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalText = document.getElementById('modal-text');
        const modalIcon = document.getElementById('modal-icon');
        const bgContainer = document.getElementById('background-elements');
        
        // Hint Elements
        const btnHint = document.getElementById('btn-hint');
        const hintModal = document.getElementById('hint-modal');
        const hintContent = document.getElementById('hint-content');

        // --- State ---
        let noClickCount = 0;
        const noTexts = [
            "都不是", 
            "你确定？", 
            "再给你一次机会", 
            "别骗自己了", 
            "必须选一个！", 
            "...", 
            "👀"
        ];

        // --- Hint Logic ---
        btnHint.addEventListener('click', () => {
            hintModal.classList.remove('hidden');
            setTimeout(() => {
                hintModal.classList.remove('opacity-0');
                hintContent.classList.remove('scale-95');
                hintContent.classList.add('scale-100');
            }, 10);
        });

        function closeHint() {
            hintModal.classList.add('opacity-0');
            hintContent.classList.remove('scale-100');
            hintContent.classList.add('scale-95');
            setTimeout(() => {
                hintModal.classList.add('hidden');
            }, 300);
        }

        hintModal.addEventListener('click', (e) => {
            if (e.target === hintModal) {
                closeHint();
            }
        });

        // --- Reset Game ---
        function resetGame() {
            resultModal.classList.add('hidden');
            noClickCount = 0;
            btnNo.innerText = "都不是";
            
            // Reset Styles
            btnNo.style.display = 'block';
            btnNo.style.transform = 'scale(1)';
            btnNo.style.left = '0px'; 
            
            btnPig.style.transform = 'scale(1) translate(0, 0)';
            btnGrand.style.transform = 'scale(1) translate(0, 0)';
            
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // --- Logic: "Neither" Button Interaction ---
        btnNo.addEventListener('click', (e) => {
            e.preventDefault(); 
            noClickCount++;

            // 1. Shrink "No" button
            const scaleNo = Math.max(0, 1 - (noClickCount * 0.2));
            btnNo.style.transform = `scale(${scaleNo})`;
            const randomX = (Math.random() - 0.5) * 60; // Reduced wiggle for mobile
            btnNo.style.left = `${randomX}px`;

            if (scaleNo <= 0.1) btnNo.style.display = 'none';
            if (noClickCount < noTexts.length) btnNo.innerText = noTexts[noClickCount];

            // 2. Expand "Yes" buttons (Responsive Logic)
            const isDesktop = window.innerWidth >= 768;
            
            if (isDesktop) {
                // Desktop: Strong expansion
                const maxTranslate = window.innerWidth * 0.25;
                const moveSpeed = 60; 
                const currentMove = Math.min(noClickCount * moveSpeed, maxTranslate);
                const scaleYes = 1 + (noClickCount * 0.6); 
                
                btnPig.style.transform = `translateX(-${currentMove}px) scale(${scaleYes})`;
                btnGrand.style.transform = `translateX(${currentMove}px) scale(${scaleYes})`;
            } else {
                // Mobile: Gentle expansion & Limited movement
                // Cap the scale so it doesn't overflow screen width insanely
                const maxScale = 2.2; 
                let scaleYes = 1 + (noClickCount * 0.3);
                if (scaleYes > maxScale) scaleYes = maxScale;

                // Limit vertical movement so top button doesn't cover title
                const maxTranslateY = 50; 
                const currentMove = Math.min(noClickCount * 15, maxTranslateY);

                // Pig moves slightly UP (but not too much), Grandchild moves DOWN
                btnPig.style.transform = `translateY(-${currentMove}px) scale(${scaleYes})`;
                btnGrand.style.transform = `translateY(${currentMove}px) scale(${scaleYes})`;
            }
            
            // Ensure z-index is lower than title (title is z-60)
            btnPig.style.zIndex = 40;
            btnGrand.style.zIndex = 40;

            mainCard.classList.add('animate-pulse');
            setTimeout(() => mainCard.classList.remove('animate-pulse'), 200);
        });

        // --- Logic: "Is Pig" Button ---
        btnPig.addEventListener('click', () => {
            showModal('恭喜你答对了！', '看来冯世娇就是一只可爱的小猪！<br>🎉🐷🎉', '🐷');
            startFireworks();
        });

        // --- Logic: "Grandchild" Button ---
        btnGrand.addEventListener('click', () => {
            showModal('认亲成功！', '“我的乖孙子，冯小猪。”<br>—— 王朱德 👴', '👴🏻');
            createFloatingHearts();
        });

        // --- Helper: Show Modal ---
        function showModal(title, text, icon) {
            modalTitle.innerText = title;
            modalText.innerHTML = text;
            modalIcon.innerText = icon;
            resultModal.classList.remove('hidden');
        }

        // --- Background & Visual Effects ---
        const icons = ['🐷', '🌸', '✨', '🐽', '💖'];
        for(let i = 0; i < 15; i++) {
            const el = document.createElement('div');
            el.classList.add('floater');
            el.innerText = icons[Math.floor(Math.random() * icons.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.animationDuration = (Math.random() * 10 + 10) + 's';
            el.style.animationDelay = (Math.random() * 5) + 's';
            bgContainer.appendChild(el);
        }

        function createFloatingHearts() {
             for(let i=0; i<30; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.innerText = '💖';
                    heart.style.position = 'fixed';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.bottom = '-50px';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    heart.style.transition = 'all 3s ease-out';
                    heart.style.zIndex = 60;
                    document.body.appendChild(heart);
                    requestAnimationFrame(() => {
                        heart.style.transform = `translateY(-100vh) rotate(${Math.random() * 360}deg)`;
                        heart.style.opacity = 0;
                    });
                    setTimeout(() => heart.remove(), 3000);
                }, i * 100);
             }
        }

        // --- Fireworks ---
        function startFireworks() {
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            let particles = [];
            const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ff69b4'];

            function createFirework(x, y) {
                const particleCount = 100;
                for (let i = 0; i < particleCount; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        alpha: 1,
                        color: colors[Math.floor(Math.random() * colors.length)],
                        size: Math.random() * 3 + 1
                    });
                }
            }

            let interval = setInterval(() => {
                createFirework(Math.random() * canvas.width, Math.random() * canvas.height / 2);
            }, 500);

            setTimeout(() => clearInterval(interval), 5000);

            function animate() {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)'; 
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.05; 
                    p.alpha -= 0.01;
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    if (p.alpha <= 0) { particles.splice(i, 1); i--; }
                }
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        }
    </script>
</body>
</html>
